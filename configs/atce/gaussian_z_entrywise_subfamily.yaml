name: atce_gaussian_z_entrywise_subfamily
objective: gaussian

# Selection diagram: Z (node 0) and Y (node 2) are shifted.
# Single query: P(Y | do(X=0)). Under do(X=v), W[1,2] (X->Y) is severed — but
# W[0,2] (Z->Y) survives and is the active mechanism edge. The adversary can
# also shift W[1,2] observationally; do(X=v) interventions simply zero its effect.
# Z is a root node (no incoming edges) — environment shift only.
#
# NOTE: P(Y|do(X)) transportability is not assumed. Certified interval vs oracle.

data:
  source: data_configs/atce.yaml

ambiguity:
  mechanism:
    type: EntrywiseBox
    shifted_rows: [0, 1]          # rows with nonzero B entries (column 2 = Y's mechanism)
    B:
      - [0.0, 0.0, 0.3]          # B[0,2]=0.3 (Z->Y)
      - [0.0, 0.0, 0.3]          # B[1,2]=0.3 (X->Y)
      - [0.0, 0.0, 0.0]
  environment:
    type: GelbrichBall
    shifted_rows: [0, 2]          # Z and Y noise shifts
    eps: 0.2

constructive_class:
  type: markovian
  shifted_nodes: [0, 2]           # Z and Y; tau[0,0] and tau[2,2] free, tau[1,1]=1

training:
  eta_tau: 0.005
  eta_adv: 0.005
  k_tau: 5
  k_adv: 2
  n_iters: 5000
  tol: 1.0e-5
  conv_window: 30
  seed: 42
  grad_backend: autograd
  query_family:
    - intervention_idx: 1
      O: [2]                      # do(X=0), observe Y
    - intervention_idx: 2
      O: [2]                      # do(X=1), observe Y
